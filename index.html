<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Hồ Tây Online</title>
<meta name="description" content="Dạo Hồ Tây trực tuyến: tạo nhân vật, gặp bạn bè, trò chuyện và rủ nhau chơi Đoán Từ.">
<link rel="stylesheet" href="world.css?v=4">
</head>
<body>
<canvas id="cv"></canvas>

<div id="login" class="overlay">
  <div class="panel">
    <h1>🌅 Hồ Tây Online</h1>
    <p class="muted">Tạo nhân vật, dạo quanh hồ, gặp người khác và rủ nhau chơi Đoán Từ.</p>
    <label>Tên của bạn<input id="l-name" maxlength="16" placeholder="Ví dụ: Lan Anh" autocomplete="off"></label>
    <div class="row"><canvas id="preview" width="96" height="110"></canvas>
      <div>
        <div class="muted small">Màu áo</div><div id="l-colors" class="swatches"></div>
        <div class="muted small">Phụ kiện</div><div id="l-hats" class="swatches"></div>
      </div></div>
    <button id="l-go" class="primary">Vào Hồ Tây</button>
    <div id="l-err" class="err"></div>
    <a class="muted small" href="doantu.html">Hoặc chơi Đoán Từ một mình →</a>
  </div>
</div>

<div id="hud" hidden>
  <div id="online" class="box"><b>Đang online <span id="n-online">0</span></b><div id="plist"></div></div>
  <div id="chatlog"></div>
  <form id="chatform"><input id="chat" maxlength="120" placeholder="Nhắn gì đó… (Enter để gửi)" autocomplete="off"><button class="primary">Gửi</button></form>
  <div id="emotes"><button>👋</button><button>😂</button><button>❤️</button><button>👍</button><button>🎉</button></div>
  <div id="conn" class="box small"></div>
  <div id="menu"><button id="b-share" class="btn">🔗 Mời bạn bè</button> <button id="b-room" class="btn">🔒 Phòng riêng</button> <a href="doantu.html" class="btn">🔤 Đoán Từ hằng ngày</a></div>
</div>

<div id="card" class="box" hidden></div>
<div id="invite" class="box" hidden></div>
<div id="toast"></div>

<div id="duel" class="overlay" hidden>
  <div class="panel wide">
    <div class="duelhead"><b id="d-title">Đoán Từ đối kháng</b><button id="d-leave">Rời ván</button></div>
    <p id="d-hint" class="muted"></p>
    <div class="boards"><div><div class="muted small" id="d-me">Bạn</div><div id="d-board" class="board"></div></div>
      <div><div class="muted small" id="d-opp">Đối thủ</div><div id="d-oppboard" class="board small"></div></div></div>
    <div id="d-msg" class="msg"></div>
    <div id="d-kb" class="kb"></div>
  </div>
</div>
<script type="module" src="world.js?v=4"></script>
</body>
</html>
